<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KolaRadio — Вход</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e3a8a, #0f172a 70%);
    color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 32px; max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 { font-size: 28px; margin-bottom: 6px; letter-spacing: 1px; }
  h1 span { color: #60a5fa; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #94a3b8;
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #334155; background: rgba(15,23,42,0.7);
    color: #e2e8f0; font-size: 15px; outline: none; transition: .2s;
    font-family: inherit;
  }
  .field input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,0.15); }
  button {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: #3b82f6; color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: .2s; margin-top: 6px;
    font-family: inherit;
  }
  button:hover { background: #2563eb; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: #f87171; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hint { color: #64748b; font-size: 12px; margin-top: 20px; line-height: 1.5; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>Kola<span>Radio</span></h1>
  <div class="sub">Вход в систему</div>

  <div class="field">
    <label>Логин</label>
    <input type="text" id="username" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label>Пароль</label>
    <input type="password" id="password" autocomplete="current-password">
  </div>

  <button id="loginBtn" onclick="doLogin()">Войти</button>
  <div class="err" id="err"></div>

  <div class="hint">
    Доступ выдаёт администратор.<br>
    Если у вас нет логина — обратитесь к нему.
  </div>
</div>

<script>
const userEl = document.getElementById('username');
const passEl = document.getElementById('password');
const btn = document.getElementById('loginBtn');
const errEl = document.getElementById('err');

/* Проверяем сессию — если уже вошли, идём на главную */
fetch('/api/me').then(r => {
  if (r.ok) window.location.href = '/';
}).catch(()=>{});

async function doLogin() {
  const username = userEl.value.trim();
  const password = passEl.value;

  if (!username || !password) {
    errEl.textContent = 'Введите логин и пароль';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Вход...';
  errEl.textContent = '';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'same-origin'
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Ошибка');

    // Успех — идём на главную
    window.location.href = '/';
  } catch (e) {
    errEl.textContent = '❌ ' + e.message;
    btn.disabled = false;
    btn.textContent = 'Войти';
  }
}

userEl.addEventListener('keydown', e => { if (e.key === 'Enter') passEl.focus(); });
passEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
