<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KolaRadio — Панель</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 820px; margin: 0 auto; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 { font-size: 24px; }
  .topbar h1 span { color: #60a5fa; }
  .user-badge {
    display: flex; align-items: center; gap: 10px;
    background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 8px 14px; font-size: 13px;
  }
  .user-badge .name { color: #60a5fa; font-weight: 700; }
  .user-badge button {
    background: #334155; border: none; color: #e2e8f0;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    font-size: 12px; font-weight: 600;
  }
  .user-badge button:hover { background: #475569; }
  .user-badge .link-users {
    background: #8b5cf6; color: #fff; border: none;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    font-size: 12px; font-weight: 600; text-decoration: none;
  }
  .user-badge .link-users:hover { background: #7c3aed; }

  .panel {
    background: #1e293b; border-radius: 16px; padding: 18px;
    margin-bottom: 16px; border: 1px solid #334155;
  }
  .panel h2 { font-size: 13px; margin-bottom: 14px; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 1px; }

  button {
    background: #3b82f6; color: #fff; border: none;
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: .2s;
    font-family: inherit;
  }
  button:hover { background: #2563eb; transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.warn { background: #f59e0b; }
  button.warn:hover { background: #d97706; }
  button.ghost { background: #334155; }
  button.ghost:hover { background: #475569; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .volume-box {
    display: flex; align-items: center; gap: 12px;
    background: #0f172a; border: 1px solid #334155;
    border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
  }
  .volume-box .icon { font-size: 18px; cursor: pointer; user-select: none; }
  .volume-box .icon.muted { opacity: .4; }
  .volume-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #3b82f6 0%, #3b82f6 var(--val, 70%), #334155 var(--val, 70%), #334155 100%);
    outline: none; cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; cursor: pointer;
  }
  .volume-slider::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; cursor: pointer; border: none;
  }
  .volume-value { font-size: 13px; font-weight: 600; min-width: 36px;
    text-align: right; color: #cbd5e1; }

  .tabs {
    display: flex; gap: 6px; margin-bottom: 16px;
    background: #0f172a; padding: 5px; border-radius: 12px;
    border: 1px solid #334155;
  }
  .tab { flex: 1; padding: 10px 14px; text-align: center;
    border-radius: 8px; cursor: pointer; font-size: 14px;
    font-weight: 600; color: #94a3b8; transition: .2s; user-select: none; }
  .tab.active { background: #3b82f6; color: #fff; }
  .tab:not(.active):hover { background: #1e293b; color: #e2e8f0; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .upload {
    display: block; border: 2px dashed #475569; border-radius: 12px;
    padding: 32px 20px; text-align: center; cursor: pointer;
    transition: .2s; background: rgba(15,23,42,0.5);
  }
  .upload:hover, .upload.drag { border-color: #60a5fa; background: rgba(96,165,250,0.08); }
  .upload input { display: none; }
  .upload .icon { font-size: 40px; margin-bottom: 8px; }
  .upload .text { font-size: 15px; color: #cbd5e1; }
  .upload .sub { font-size: 12px; color: #64748b; margin-top: 6px; }

  .url-input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
    font-size: 14px; margin-bottom: 10px; outline: none;
    font-family: inherit;
  }
  .url-input:focus { border-color: #60a5fa; }
  .url-input::placeholder { color: #475569; }
  .row { display: flex; gap: 10px; }
  .row .url-input { margin-bottom: 0; }

  .track {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border-radius: 10px; margin-bottom: 6px;
    background: #0f172a; border: 1px solid #334155;
  }
  .track.current { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
  .track.current.stopped { border-color: #ef4444; background: rgba(239,68,68,0.1); }
  .track .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; margin-right: 10px; }
  .track .btns { display: flex; gap: 6px; }
  .track button { padding: 6px 12px; font-size: 12px; }

  .now {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    padding: 16px; border-radius: 12px; text-align: center;
    font-size: 18px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .now.stopped { background: linear-gradient(135deg, #475569, #334155); }
  .info { font-size: 12px; color: #64748b; margin-top: 8px; }
  .status { margin-top: 12px; padding: 10px 14px; border-radius: 10px;
    font-size: 13px; display: none; }
  .status.show { display: block; }
  .status.ok { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid #22c55e55; }
  .status.err { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid #ef444455; }
  .status.loading { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid #3b82f655; }

  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .no-perm {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    color: #f87171; padding: 10px 14px; border-radius: 10px;
    font-size: 13px; margin-bottom: 12px;
  }

  @media (max-width: 500px) {
    .row { flex-direction: column; }
    .topbar h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>Kola<span>Radio</span> — Панель</h1>
    <div class="user-badge">
      <span>👤 <span class="name" id="usernameEl">...</span></span>
      <a href="/admin/users" class="link-users" id="usersLink" style="display:none;">👥 Пользователи</a>
      <button onclick="logout()">Выйти</button>
    </div>
  </div>

  <!-- Сейчас играет -->
  <div class="panel">
    <h2>Сейчас играет</h2>
    <div class="now" id="now">—</div>

    <div class="volume-box" style="margin-top: 14px;">
      <div class="icon" id="muteBtn">🔊</div>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
      <div class="volume-value" id="volumeValue">70%</div>
    </div>

    <div class="controls">
      <button onclick="prev()">⏮ Назад</button>
      <button onclick="toggle()" id="toggleBtn">⏸ Пауза</button>
      <button onclick="next()">⏭ Вперёд</button>
      <button class="warn" onclick="stopAll()">⏹ Стоп для всех</button>
    </div>
    <div class="info" id="info"></div>
  </div>

  <!-- Добавить музыку -->
  <div class="panel">
    <h2>Добавить музыку</h2>

    <div id="uploadSection">
      <div class="tabs">
        <div class="tab active" data-tab="pc">💻 С компьютера</div>
        <div class="tab" data-tab="url">🔗 По ссылке</div>
      </div>

      <div class="tab-content active" id="tab-pc">
        <label class="upload" id="dropZone">
          <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac">
          <div class="icon">📁</div>
          <div class="text">Нажми или перетащи файлы сюда</div>
          <div class="sub">MP3, WAV, OGG, M4A, AAC, FLAC</div>
        </label>
        <div class="status" id="pcStatus"></div>
      </div>

      <div class="tab-content" id="tab-url">
        <input class="url-input" id="urlInput" type="url" placeholder="https://example.com/track.mp3">
        <input class="url-input" id="titleInput" type="text" placeholder="Название (необязательно)">
        <div class="row" style="margin-top: 10px;">
          <button id="urlBtn" onclick="uploadByUrl()">⬇️ Скачать</button>
          <button class="ghost" onclick="clearUrl()">Очистить</button>
        </div>
        <div class="status" id="urlStatus"></div>
      </div>
    </div>
  </div>

  <!-- Плейлист -->
  <div class="panel">
    <h2>Плейлист</h2>
    <div id="playlist"></div>
  </div>
</div>

<script>
let state = null;
let me = null;

/* Проверяем сессию */
async function checkAuth() {
  try {
    const r = await fetch('/api/me');
    if (!r.ok) { window.location.href = '/admin'; return; }
    me = await r.json();
    document.getElementById('usernameEl').textContent = me.username;
    if (me.permissions.includes('manage')) {
      document.getElementById('usersLink').style.display = 'inline-block';
    }
    applyPermissions();
  } catch(e) {
    window.location.href = '/admin';
  }
}

function hasPerm(p) {
  return me && me.permissions && me.permissions.includes(p);
}

/* Скрываем секции без прав */
function applyPermissions() {
  // Управление воспроизведением
  if (!hasPerm('control')) {
    document.querySelectorAll('.controls button').forEach(b => {
      b.disabled = true;
      b.title = 'Нет прав на управление';
    });
  }

  // Загрузка
  if (!hasPerm('upload')) {
    document.getElementById('uploadSection').innerHTML =
      '<div class="no-perm">🚫 У вас нет прав на загрузку музыки</div>';
  }
}

/* Громкость */
const volumeSlider = document.getElementById('volumeSlider');
const volumeValue = document.getElementById('volumeValue');
const muteBtn = document.getElementById('muteBtn');
let lastVolume = 70;
let isMuted = false;

try {
  const v = localStorage.getItem('kola_admin_volume');
  if (v !== null) lastVolume = parseInt(v, 10) || 70;
} catch(e){}

updateVolumeUI();

function updateVolumeUI() {
  const v = isMuted ? 0 : parseInt(volumeSlider.value, 10);
  volumeSlider.style.setProperty('--val', v + '%');
  volumeValue.textContent = v + '%';
  if (isMuted || v === 0) { muteBtn.textContent = '🔇'; muteBtn.classList.add('muted'); }
  else if (v < 50) { muteBtn.textContent = '🔉'; muteBtn.classList.remove('muted'); }
  else { muteBtn.textContent = '🔊'; muteBtn.classList.remove('muted'); }
}

volumeSlider.addEventListener('input', () => {
  const v = parseInt(volumeSlider.value, 10);
  lastVolume = v || lastVolume;
  isMuted = v === 0;
  try { localStorage.setItem('kola_admin_volume', v); } catch(e){}
  updateVolumeUI();
});

muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  volumeSlider.value = isMuted ? 0 : (lastVolume || 70);
  try { localStorage.setItem('kola_admin_volume', volumeSlider.value); } catch(e){}
  updateVolumeUI();
});

/* Вкладки */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

function showStatus(el, text, type = 'ok') {
  el.className = 'status show ' + type;
  el.innerHTML = (type === 'loading' ? '<span class="spinner"></span>' : '') + text;
}
function hideStatus(el) { el.className = 'status'; }

/* Состояние */
async function refresh() {
  const r = await fetch('/api/playlist');
  renderPlaylist(await r.json());
}
async function loadState() {
  const r = await fetch('/api/state');
  state = await r.json();
  renderState();
}
function renderState() {
  const now = document.getElementById('now');
  if (!state || !state.track) {
    now.textContent = '— пусто —';
    now.classList.remove('stopped');
    document.getElementById('info').textContent = 'Плейлист пуст';
    return;
  }
  now.textContent = state.track.title;
  now.classList.toggle('stopped', !state.isPlaying);
  document.getElementById('info').textContent =
    `Трек ${state.currentIndex + 1} из ${state.total} • ${state.isPlaying ? '▶ Играет' : '⏹ Остановлено'}`;
  document.getElementById('toggleBtn').textContent =
    state.isPlaying ? '⏸ Пауза' : '▶ Играть';
}

function renderPlaylist(list) {
  const el = document.getElementById('playlist');
  if (list.length === 0) {
    el.innerHTML = '<div class="info">Плейлист пуст. Добавьте треки выше.</div>';
    return;
  }
  el.innerHTML = list.map((t, i) => {
    const isCurrent = state && state.currentIndex === i;
    const isStopped = isCurrent && state && !state.isPlaying;
    const canDel = hasPerm('delete');
    return `
      <div class="track ${isCurrent ? 'current' : ''} ${isStopped ? 'stopped' : ''}">
        <div class="name">${i + 1}. ${escapeHtml(t.title)}</div>
        <div class="btns">
          <button onclick="play(${i})" ${hasPerm('control') ? '' : 'disabled'}>▶</button>
          ${canDel ? `<button class="danger" onclick="del('${encodeURIComponent(t.file)}', ${isCurrent})">✕</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* Управление */
async function play(i){ await fetch('/api/play/'+i,{method:'POST'}); await loadState(); await refresh(); }
async function next(){ await fetch('/api/next',{method:'POST'}); await loadState(); await refresh(); }
async function prev(){ await fetch('/api/prev',{method:'POST'}); await loadState(); await refresh(); }
async function toggle(){ await fetch('/api/toggle',{method:'POST'}); await loadState(); await refresh(); }
async function stopAll(){ await fetch('/api/stop',{method:'POST'}); await loadState(); await refresh(); }

async function del(name, isCurrent) {
  const msg = isCurrent
    ? 'Удалить ТЕКУЩИЙ трек? Воспроизведение остановится у всех.'
    : 'Удалить трек?';
  if (!confirm(msg)) return;
  await fetch('/api/track/'+name,{method:'DELETE'});
  await loadState(); await refresh();
}

async function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/admin';
}

/* Загрузка с ПК */
const fileInput = document.getElementById('fileInput');
const pcStatus = document.getElementById('pcStatus');
const dropZone = document.getElementById('dropZone');

if (fileInput) {
  fileInput.addEventListener('change', e => handleFiles(e.target.files));
  ['dragenter','dragover'].forEach(ev =>
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag'); })
  );
  ['dragleave','drop'].forEach(ev =>
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag'); })
  );
  dropZone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
}

async function handleFiles(files) {
  if (!files || !files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  showStatus(pcStatus, `Загружаю ${files.length} файл(ов)...`, 'loading');
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    if (!r.ok) {
      const d = await r.json().catch(()=>({}));
      throw new Error(d.error || 'HTTP ' + r.status);
    }
    showStatus(pcStatus, `✅ Загружено: ${files.length}`, 'ok');
    fileInput.value = '';
    await loadState(); await refresh();
    setTimeout(() => hideStatus(pcStatus), 3000);
  } catch (e) {
    showStatus(pcStatus, '❌ ' + e.message, 'err');
  }
}

/* Загрузка по ссылке */
const urlInput = document.getElementById('urlInput');
const titleInput = document.getElementById('titleInput');
const urlStatus = document.getElementById('urlStatus');
const urlBtn = document.getElementById('urlBtn');

async function uploadByUrl() {
  const url = urlInput.value.trim();
  const title = titleInput.value.trim();
  if (!url) { showStatus(urlStatus, '⚠️ Введите ссылку', 'err'); return; }
  urlBtn.disabled = true;
  showStatus(urlStatus, 'Скачиваю на сервер...', 'loading');
  try {
    const r = await fetch('/api/upload-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, title })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Ошибка сервера');
    showStatus(urlStatus, `✅ Добавлено: ${data.file}`, 'ok');
    urlInput.value = '';
    titleInput.value = '';
    await loadState(); await refresh();
    setTimeout(() => hideStatus(urlStatus), 4000);
  } catch (e) {
    showStatus(urlStatus, '❌ ' + e.message, 'err');
  } finally {
    urlBtn.disabled = false;
  }
}

function clearUrl() {
  urlInput.value = '';
  titleInput.value = '';
  hideStatus(urlStatus);
}

if (urlInput) {
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') uploadByUrl(); });
  titleInput.addEventListener('keydown', e => { if (e.key === 'Enter') uploadByUrl(); });
}

/* Старт */
checkAuth().then(() => {
  loadState(); refresh();
  setInterval(async () => { await loadState(); await refresh(); }, 3000);
});
</script>
</body>
</html>
