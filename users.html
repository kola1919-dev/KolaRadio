<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KolaRadio — Пользователи</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 { font-size: 24px; }
  .topbar h1 span { color: #60a5fa; }
  .topbar a {
    color: #60a5fa; text-decoration: none; font-size: 14px;
    background: #1e293b; padding: 8px 14px; border-radius: 10px;
    border: 1px solid #334155;
  }
  .topbar a:hover { background: #334155; }

  .panel {
    background: #1e293b; border-radius: 16px; padding: 18px;
    margin-bottom: 16px; border: 1px solid #334155;
  }
  .panel h2 { font-size: 13px; margin-bottom: 14px; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 1px; }

  .user-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-radius: 10px; margin-bottom: 8px;
    background: #0f172a; border: 1px solid #334155;
    flex-wrap: wrap; gap: 10px;
  }
  .user-row.root { border-color: #f59e0b; background: rgba(245,158,11,0.08); }
  .user-row .info { flex: 1; min-width: 200px; }
  .user-row .name { font-size: 15px; font-weight: 700; }
  .user-row .name .root-badge {
    display: inline-block; background: #f59e0b; color: #0f172a;
    font-size: 10px; padding: 2px 6px; border-radius: 6px;
    margin-left: 6px; font-weight: 800; letter-spacing: 1px;
  }
  .user-row .perms { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .user-row .btns { display: flex; gap: 6px; flex-wrap: wrap; }

  button {
    background: #3b82f6; color: #fff; border: none;
    padding: 9px 16px; border-radius: 10px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: .2s;
    font-family: inherit;
  }
  button:hover { background: #2563eb; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.ghost { background: #334155; }
  button.ghost:hover { background: #475569; }
  button.purple { background: #8b5cf6; }
  button.purple:hover { background: #7c3aed; }

  .perm-check {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: #0f172a;
    border: 1px solid #334155; border-radius: 10px;
    cursor: pointer; user-select: none; margin-bottom: 8px;
  }
  .perm-check:hover { border-color: #60a5fa; }
  .perm-check input { width: 18px; height: 18px; cursor: pointer; accent-color: #3b82f6; }
  .perm-check .label { font-size: 14px; font-weight: 600; }
  .perm-check .desc { font-size: 11px; color: #64748b; margin-top: 2px; }
  .perm-check .content { flex: 1; }
  .perm-check.locked { opacity: .7; cursor: not-allowed; background: #1a2438; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #94a3b8;
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .field input {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a;
    color: #e2e8f0; font-size: 14px; outline: none;
    font-family: inherit;
  }
  .field input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,0.15); }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .row-2 { grid-template-columns: 1fr; } }

  .msg { padding: 10px 14px; border-radius: 10px; font-size: 13px;
    margin-top: 10px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid #22c55e55; }
  .msg.err { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid #ef444455; }

  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #1e293b; border: 1px solid #334155;
    border-radius: 16px; padding: 24px; max-width: 480px; width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 20px; margin-bottom: 18px; }
  .modal .actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal .actions button { flex: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>Kola<span>Radio</span> — Пользователи</h1>
    <a href="/admin/panel">← Назад</a>
  </div>

  <div class="panel">
    <h2>➕ Создать пользователя</h2>

    <div class="row-2">
      <div class="field">
        <label>Логин</label>
        <input type="text" id="newUsername" placeholder="например: vasya" autocomplete="off">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="text" id="newPassword" placeholder="минимум 4 символа" autocomplete="off">
      </div>
    </div>

    <label class="perm-check locked">
      <input type="checkbox" checked disabled>
      <div class="content">
        <div class="label">🎧 Прослушивание</div>
        <div class="desc">Обязательное право — все пользователи могут слушать</div>
      </div>
    </label>
    <label class="perm-check">
      <input type="checkbox" id="perm-upload" checked>
      <div class="content">
        <div class="label">📤 Загрузка музыки</div>
        <div class="desc">Файлы с ПК и по ссылке</div>
      </div>
    </label>
    <label class="perm-check">
      <input type="checkbox" id="perm-delete">
      <div class="content">
        <div class="label">🗑 Удаление треков</div>
      </div>
    </label>
    <label class="perm-check">
      <input type="checkbox" id="perm-control" checked>
      <div class="content">
        <div class="label">▶ Управление воспроизведением</div>
        <div class="desc">Play / Пауза / Вперёд / Назад / Стоп</div>
      </div>
    </label>
    <label class="perm-check">
      <input type="checkbox" id="perm-manage">
      <div class="content">
        <div class="label">👥 Управление пользователями</div>
      </div>
    </label>

    <button onclick="createUser()" style="margin-top: 10px;">Создать</button>
    <div class="msg" id="createMsg"></div>
  </div>

  <div class="panel">
    <h2>👥 Все пользователи</h2>
    <div id="usersList"></div>
  </div>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>Редактировать: <span id="editName" style="color:#60a5fa"></span></h3>

    <label class="perm-check locked">
      <input type="checkbox" checked disabled>
      <div class="content"><div class="label">🎧 Прослушивание</div></div>
    </label>
    <label class="perm-check">
      <input type="checkbox" id="edit-perm-upload">
      <div class="content"><div class="label">📤 Загрузка музыки</div></div>
    </label>
    <label class="perm-check">
      <input type="checkbox" id="edit-perm-delete">
      <div class="content"><div class="label">🗑 Удаление треков</div></div>
    </label>
    <label class="perm-check">
      <input type="checkbox" id="edit-perm-control">
      <div class="content"><div class="label">▶ Управление воспроизведением</div></div>
    </label>
    <label class="perm-check">
      <input type="checkbox" id="edit-perm-manage">
      <div class="content"><div class="label">👥 Управление пользователями</div></div>
    </label>

    <div class="field" style="margin-top: 16px;">
      <label>Новый пароль (пусто — не менять)</label>
      <input type="text" id="editPassword" placeholder="минимум 4 символа" autocomplete="off">
    </div>

    <div class="actions">
      <button class="ghost" onclick="closeEdit()">Отмена</button>
      <button onclick="saveEdit()">Сохранить</button>
    </div>
    <div class="msg" id="editMsg"></div>
  </div>
</div>

<script>
let users = [];
let editingUser = null;

async function checkAuth() {
  const r = await fetch('/api/me', { credentials: 'same-origin' });
  if (!r.ok) { window.location.href = '/login'; return false; }
  const me = await r.json();
  if (!me.permissions.includes('manage')) {
    alert('Нет прав');
    window.location.href = '/admin/panel';
    return false;
  }
  return true;
}

async function loadUsers() {
  const r = await fetch('/api/users', { credentials: 'same-origin' });
  if (!r.ok) return;
  users = await r.json();
  renderUsers();
}

function renderUsers() {
  const el = document.getElementById('usersList');
  if (users.length === 0) {
    el.innerHTML = '<div style="color:#64748b;font-size:13px;">Нет пользователей</div>';
    return;
  }
  el.innerHTML = users.map(u => {
    const permLabels = {
      listen: '🎧 Слушать',
      upload: '📤 Загрузка',
      delete: '🗑 Удаление',
      control: '▶ Управление',
      manage: '👥 Юзеры'
    };
    const permsText = u.permissions
      .map(p => permLabels[p] || p).join(' • ');

    return `
      <div class="user-row ${u.isRoot ? 'root' : ''}">
        <div class="info">
          <div class="name">
            ${escapeHtml(u.username)}
            ${u.isRoot ? '<span class="root-badge">ГЛАВНЫЙ</span>' : ''}
          </div>
          <div class="perms">${permsText}</div>
        </div>
        <div class="btns">
          ${u.isRoot ? '' : `
            <button class="purple" onclick="openEdit('${escapeJs(u.username)}')">✏️ Изменить</button>
            <button class="danger" onclick="deleteUser('${escapeJs(u.username)}')">🗑</button>
          `}
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeJs(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g, "\\'");
}

async function createUser() {
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const permissions = ['listen']; // обязательно
  if (document.getElementById('perm-upload').checked) permissions.push('upload');
  if (document.getElementById('perm-delete').checked) permissions.push('delete');
  if (document.getElementById('perm-control').checked) permissions.push('control');
  if (document.getElementById('perm-manage').checked) permissions.push('manage');

  const msg = document.getElementById('createMsg');
  if (!username || !password) {
    showMsg(msg, '❌ Заполните логин и пароль', 'err');
    return;
  }

  try {
    const r = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ username, password, permissions })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Ошибка');

    showMsg(msg, `✅ Пользователь «${username}» создан`, 'ok');
    document.getElementById('newUsername').value = '';
    document.getElementById('newPassword').value = '';
    await loadUsers();
    setTimeout(() => msg.classList.remove('show'), 3000);
  } catch (e) {
    showMsg(msg, '❌ ' + e.message, 'err');
  }
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg show ' + type;
}

function openEdit(username) {
  const u = users.find(x => x.username === username);
  if (!u) return;
  editingUser = username;
  document.getElementById('editName').textContent = u.username;
  document.getElementById('edit-perm-upload').checked = u.permissions.includes('upload');
  document.getElementById('edit-perm-delete').checked = u.permissions.includes('delete');
  document.getElementById('edit-perm-control').checked = u.permissions.includes('control');
  document.getElementById('edit-perm-manage').checked = u.permissions.includes('manage');
  document.getElementById('editPassword').value = '';
  document.getElementById('editMsg').classList.remove('show');
  document.getElementById('editModal').classList.add('show');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('show');
  editingUser = null;
}

async function saveEdit() {
  if (!editingUser) return;
  const permissions = ['listen'];
  if (document.getElementById('edit-perm-upload').checked) permissions.push('upload');
  if (document.getElementById('edit-perm-delete').checked) permissions.push('delete');
  if (document.getElementById('edit-perm-control').checked) permissions.push('control');
  if (document.getElementById('edit-perm-manage').checked) permissions.push('manage');
  const password = document.getElementById('editPassword').value;

  const body = { permissions };
  if (password) body.password = password;

  const msg = document.getElementById('editMsg');
  try {
    const r = await fetch('/api/users/' + encodeURIComponent(editingUser), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Ошибка');

    showMsg(msg, '✅ Сохранено', 'ok');
    await loadUsers();
    setTimeout(closeEdit, 800);
  } catch (e) {
    showMsg(msg, '❌ ' + e.message, 'err');
  }
}

async function deleteUser(username) {
  if (!confirm(`Удалить пользователя «${username}»?`)) return;
  try {
    const r = await fetch('/api/users/' + encodeURIComponent(username), {
      method: 'DELETE', credentials: 'same-origin'
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Ошибка');
    await loadUsers();
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

checkAuth().then(ok => { if (ok) loadUsers(); });
</script>
</body>
</html>
