<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>KolaRadio — Live</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e3a8a, #0f172a 70%);
    color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow-x: hidden;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 24px; padding: 28px; max-width: 440px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center; position: relative;
  }
  .top-actions {
    position: absolute; top: 14px; right: 14px;
    display: flex; gap: 6px;
  }
  .top-actions a {
    background: rgba(15,23,42,0.7); border: 1px solid #334155;
    color: #cbd5e1; font-size: 12px; padding: 6px 10px;
    border-radius: 8px; text-decoration: none; transition: .2s;
  }
  .top-actions a:hover { background: #334155; }
  h1 { font-size: 30px; margin-bottom: 4px; letter-spacing: 1px; }
  h1 span { color: #60a5fa; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    background: #dc2626; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 20px;
  }
  .live.paused { background: #475569; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff;
    animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .cover {
    width: 170px; height: 170px; border-radius: 20px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; box-shadow: 0 10px 40px rgba(59,130,246,0.4);
  }
  .cover.playing { animation: rotate 20s linear infinite; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  .track { font-size: 19px; font-weight: 600; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
  .volume-box {
    display: flex; align-items: center; gap: 12px;
    background: rgba(15,23,42,0.5);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 12px 16px; margin-bottom: 14px;
  }
  .volume-box .icon { font-size: 20px; cursor: pointer; user-select: none; }
  .volume-box .icon.muted { opacity: .4; }
  .volume-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #3b82f6 0%, #3b82f6 var(--val, 70%), #334155 var(--val, 70%), #334155 100%);
    outline: none; cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; cursor: pointer;
  }
  .volume-slider::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; cursor: pointer; border: none;
  }
  .volume-value { font-size: 13px; font-weight: 600; min-width: 36px;
    text-align: right; color: #cbd5e1; }
  audio { display: none; }
  .stopped-badge {
    display: none;
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.4);
    color: #f87171; padding: 8px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 600; margin-bottom: 12px;
  }
  .stopped-badge.show { display: block; }
  .tap-overlay {
    position: absolute; inset: 0;
    background: rgba(15,23,42,0.96);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
    padding: 30px; text-align: center;
    transition: opacity .3s;
  }
  .tap-overlay.hide { opacity: 0; pointer-events: none; }
  .tap-overlay .icon { font-size: 70px; margin-bottom: 20px;
    animation: bounce 1.5s infinite; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .tap-overlay .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .tap-overlay .sub { font-size: 13px; color: #94a3b8; line-height: 1.5; }
</style>
</head>
<body>

<div class="card">
  <div class="top-actions">
    <a href="/admin/panel" title="Админка">⚙️</a>
  </div>

  <h1>Kola<span>Radio</span></h1>
  <div class="live" id="liveBadge"><span class="dot"></span> LIVE</div>

  <div class="stopped-badge" id="stoppedBadge">⏹ Воспроизведение остановлено</div>

  <div class="cover" id="cover">🎵</div>
  <div class="track" id="track">Загрузка...</div>
  <div class="status" id="status">Подключение...</div>

  <div class="volume-box">
    <div class="icon" id="muteBtn" title="Вкл/выкл звук">🔊</div>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
    <div class="volume-value" id="volumeValue">70%</div>
  </div>

  <audio id="player" preload="auto"></audio>

  <div class="tap-overlay" id="tapOverlay">
    <div class="icon">🎵</div>
    <div class="title">Нажми в любом месте</div>
    <div class="sub">Одно касание — и радио заиграет.</div>
  </div>
</div>

<script>
const player = document.getElementById('player');
const trackEl = document.getElementById('track');
const statusEl = document.getElementById('status');
const cover = document.getElementById('cover');
const tapOverlay = document.getElementById('tapOverlay');
const stoppedBadge = document.getElementById('stoppedBadge');
const liveBadge = document.getElementById('liveBadge');
const volumeSlider = document.getElementById('volumeSlider');
const volumeValue = document.getElementById('volumeValue');
const muteBtn = document.getElementById('muteBtn');

let state = null;
let autoplayUnlocked = false;
let lastVolume = 70;
let isMuted = false;

try {
  const v = localStorage.getItem('kola_volume');
  if (v !== null) lastVolume = parseInt(v, 10) || 70;
} catch(e){}

player.volume = lastVolume / 100;
volumeSlider.value = lastVolume;
updateVolumeUI();

function updateVolumeUI() {
  const v = isMuted ? 0 : parseInt(volumeSlider.value, 10);
  volumeSlider.style.setProperty('--val', v + '%');
  volumeValue.textContent = v + '%';
  if (isMuted || v === 0) { muteBtn.textContent = '🔇'; muteBtn.classList.add('muted'); }
  else if (v < 50) { muteBtn.textContent = '🔉'; muteBtn.classList.remove('muted'); }
  else { muteBtn.textContent = '🔊'; muteBtn.classList.remove('muted'); }
}

volumeSlider.addEventListener('input', () => {
  const v = parseInt(volumeSlider.value, 10);
  lastVolume = v || lastVolume;
  isMuted = v === 0;
  player.volume = v / 100;
  try { localStorage.setItem('kola_volume', v); } catch(e){}
  updateVolumeUI();
});

muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  player.volume = isMuted ? 0 : (lastVolume || 70) / 100;
  volumeSlider.value = isMuted ? 0 : (lastVolume || 70);
  try { localStorage.setItem('kola_volume', volumeSlider.value); } catch(e){}
  updateVolumeUI();
});

try { autoplayUnlocked = localStorage.getItem('kola_autoplay') === '1'; } catch(e){}

function startPlayback() {
  if (!state || !state.track) return;
  player.src = '/stream?t=' + Date.now();
  player.load();
  const p = player.play();
  if (p) {
    p.then(() => {
      autoplayUnlocked = true;
      try { localStorage.setItem('kola_autoplay', '1'); } catch(e){}
      hideOverlay();
    }).catch(() => { if (!autoplayUnlocked) showOverlay(); });
  }
}
function stopPlayback() {
  player.pause();
  player.removeAttribute('src');
  player.load();
}
function showOverlay() { tapOverlay.classList.remove('hide'); }
function hideOverlay() { tapOverlay.classList.add('hide'); }

function userGestureHandler() {
  autoplayUnlocked = true;
  try { localStorage.setItem('kola_autoplay', '1'); } catch(e){}
  if (state && state.isPlaying && state.track && player.paused) {
    player.play().catch(()=>{});
  }
  hideOverlay();
}

['click', 'touchstart', 'keydown', 'pointerdown'].forEach(ev =>
  document.addEventListener(ev, userGestureHandler, { passive: true })
);
tapOverlay.addEventListener('click', userGestureHandler);

const es = new EventSource('/events');
es.onmessage = (e) => {
  const s = JSON.parse(e.data);
  const prev = state;
  state = s;

  if (s.track) {
    trackEl.textContent = s.track.title;
    statusEl.textContent = `Трек ${s.currentIndex + 1} из ${s.total}`;
  } else {
    trackEl.textContent = 'Радио пусто';
    statusEl.textContent = 'Подождите, пока админ загрузит музыку';
  }

  liveBadge.classList.toggle('paused', !s.isPlaying);
  stoppedBadge.classList.toggle('show', !s.isPlaying && !!s.track);
  cover.classList.toggle('playing', s.isPlaying);

  if (prev && !prev.isPlaying && s.isPlaying && s.track) { startPlayback(); return; }
  if (prev && prev.isPlaying && !s.isPlaying) { stopPlayback(); return; }
  if (s.isPlaying && s.track && prev && prev.currentIndex !== s.currentIndex) { startPlayback(); return; }
  if (!prev && s.isPlaying && s.track) startPlayback();
};

player.addEventListener('ended', () => {
  fetch('/api/ended', { method: 'POST' });
});

setInterval(() => {
  if (state && state.isPlaying && autoplayUnlocked && player.paused && state.track) {
    player.play().catch(()=>{});
  }
}, 3000);

if (!autoplayUnlocked) showOverlay();
</script>
</body>
</html>
